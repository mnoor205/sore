/* Guided setup and presentation presets */
.setup-fields {
  border: 0;
  padding: 0;
  margin: 0;
  min-width: 0;
}
.guided-setup {
  background: var(--bg);
  min-height: 900px;
}
.setup-header {
  height: 86px;
  max-width: 1440px;
  margin: auto;
  padding: 20px 45px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--line);
}
.save-status {
  font-size: 13px;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 6px;
}
.setup-layout {
  max-width: 1280px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: 330px minmax(0, 1fr);
  gap: 65px;
  padding: 50px 40px 70px;
}
.setup-sidebar {
  align-self: start;
  position: sticky;
  top: 35px;
}
.setup-sidebar > .eyebrow {
  font-size: 10px;
}
.setup-sidebar h1 {
  font-size: 35px;
  letter-spacing: -1.3px;
  line-height: 1.3;
  margin: 20px 0;
}
.setup-sidebar > p {
  font-size: 15px;
  color: var(--muted);
  max-width: 280px;
}
.setup-sidebar ol {
  padding: 0;
  margin: 35px 0;
  list-style: none;
}
.setup-sidebar li {
  display: flex;
  gap: 13px;
  align-items: center;
  padding: 15px 0;
  color: var(--muted);
}
.setup-sidebar li > span {
  width: 31px;
  height: 31px;
  border: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  font-size: 12px;
  flex-shrink: 0;
}
.setup-sidebar li.current {
  color: var(--muted);
}
.setup-sidebar li.current > span {
  background: #b00063;
  border-color: var(--line);
  color: white;
  box-shadow: 0 0 0 4px var(--line);
}
.setup-sidebar li.done > span {
  background: var(--surface-raised);
  color: var(--muted);
  border-color: var(--line);
}
.setup-sidebar li b {
  display: block;
  font-size: 14px;
  font-weight: 550;
}
.setup-sidebar li small {

  font-size: 12px;
  margin-top: 5px;
  color: var(--muted);
}
.setup-no-ai {

  padding-top: 25px;
  color: var(--muted);

}

}
.setup-main {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 15px;
  padding: 38px;
  min-width: 0;
  align-self: start;
  box-shadow: 0 4px 25px #00000033;
}
.setup-step-heading {
  margin-bottom: 30px;
}

}

}
.setup-main label {

.setup-main input,

.auth-email-form .auth-code-input {
  font-size: 26px;

/* Sore defaults to dark surfaces with pink-to-coral brand accents. */
.gradient,
.brand-icon,
.primary,
.phone-product > div,
.setup-progress .active > span,
.setup-progress .complete > span {
  background: #ec008c;
  background: var(--brand-gradient);
  color: var(--brand-on-gradient);
}
.primary:hover {
  background: var(--brand-gradient);
  filter: brightness(0.96);
}
.landing-art {
  background: linear-gradient(135deg, #111111, #0a0a0a);
}
.auth-art {
  background: linear-gradient(145deg, #111111, #000000);
  color: var(--ink);
}
.auth-art h1,
.auth-art p,
.auth-art .eyebrow,
.auth-art > span {
  color: var(--ink);
}
.auth-art .brand-icon {
  background: var(--surface);
  color: var(--purple);
}
.landing-copy h1 em {
  color: var(--purple);
}
.preset-studio .store-buy-button {
  background: #ec008c;
  background: var(--brand-gradient);
  color: var(--brand-on-gradient);
}
.style-swatch.studio {
  background: linear-gradient(135deg, var(--surface), var(--surface-raised));
}

/* Fluid layouts: keep content usable from narrow phones to wide desktops. */
html {
  scroll-padding-top: 90px;
}
body {
  min-width: 0;
}
img,
video {
  max-width: 100%;
}
:where(h1, h2, h3, p, label, a, code) {
  overflow-wrap: anywhere;
}
:where(
    .landing-main,
    .auth-page,
    .form-row,
    .editor-grid,
    .setup-layout,
    .setup-review,
    .launch-hero,
    .launch-products,
    .launch-next-grid,
    .storefront-layout,
    .connect-layout,
    .overview-grid,
    .overview-bottom,
    .pricing-grid,
    .fees-grid,
    .permission-grid,
    .choice-grid,
    .style-presets
  )
  > * {
  min-width: 0;
}
.button {
  max-width: 100%;
  white-space: normal;
  text-align: center;
}
.outline:hover {
  background: var(--surface-raised);
}
.landing-nav,
.landing-main,
.landing-footer {
  width: 100%;
  max-width: 1440px;
  padding-inline: clamp(20px, 5vw, 80px);
}
.landing-main {
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: clamp(24px, 4vw, 64px);
  padding-block: clamp(32px, 5vw, 80px);
}
.landing-copy h1 {
  font-size: clamp(44px, 5.3vw, 80px);
  letter-spacing: -0.055em;
  line-height: 1.08;
}
.landing-copy > p {
  font-size: clamp(15px, 1.3vw, 18px);
  max-width: 440px;
}
.landing-art {
  margin-left: 0;
  min-width: 0;
  border: 1px solid var(--line);
  background: radial-gradient(ellipse at center, #191919, #000 75%);
}
.landing-checks {
  flex-wrap: wrap;
  gap: 12px 18px;
}
.auth-page {
  grid-template-columns: minmax(0, 0.9fr) minmax(0, 1fr);
  min-height: 900px;
}
.auth-art {
  background: linear-gradient(145deg, #111, #000 75%);
  border-right: 1px solid var(--line);
  padding: clamp(24px, 4vw, 64px);
}
.auth-art h1 {
  font-size: clamp(30px, 3.4vw, 52px);
}
.auth-content {
  min-width: 0;
  padding: clamp(24px, 4vw, 64px);
}
.auth-card {
  max-width: 400px;
}
.auth-resend {
  flex-wrap: wrap;
}
.sidebar {
  height: 900px;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.topbar {
  gap: 12px;
}
.topbar-actions,
.breadcrumb {
  min-width: 0;
}
.dashboard-content {
  padding-inline: clamp(20px, 3vw, 48px);
}
.page-heading,
.table-toolbar,
.review-toolbar,
.modal-footer,
.preview-url,
.setup-step-footer {
  flex-wrap: wrap;
}
.page-heading > *,
.store-link-strip > span:nth-child(2),
.section-icon > div,
.activation-step > div:first-child {
  min-width: 0;
}
.tabs {
  overflow-x: auto;
  overscroll-behavior-inline: contain;
}
.tabs button {
  flex-shrink: 0;
}
.table-scroll {
  max-width: 100%;
  overscroll-behavior-inline: contain;
}
.table-scroll table {
  min-width: 600px;
}
.store-container {
  width: 100%;
}
.public-product-copy h2,
.creator-profile h1 {
  text-wrap: balance;
}
.public-cover {
  height: auto;
  aspect-ratio: 16 / 10;
}
.product-detail-page .public-cover {
  height: auto;
  aspect-ratio: 16 / 9;
}
.public-link > a > div,
.store-buy-button > span,
.order-resource > div {
  min-width: 0;
}
.modal {
  overscroll-behavior: contain;
}
.setup-header {
  height: auto;
  min-height: 80px;
  gap: 12px;
  flex-wrap: wrap;
}
.setup-step-footer .button {
  flex-shrink: 0;
}
@media (max-width: 1100px) and (min-width: 761px) {
  .landing-main {
    gap: 24px;
  }
  .landing-art {
    min-height: 500px;
  }
  .landing-phone {
    width: min(240px, 80%);
  }
  .floating-label {
    left: 0;
  }
  .floating-security {
    right: 0;
  }
  .auth-art h1 br {
    display: none;
  }
  .pricing-grid,
  .storefront-layout,
  .connect-layout {
    grid-template-columns: minmax(0, 1fr);
  }
}
@media (max-width: 760px) {
  .landing-main {
    gap: 48px;
  }
  .landing-copy h1 {
    font-size: clamp(40px, 9.5vw, 64px);
  }
  .landing-art {
    max-width: 380px;
    min-height: 500px;
  }
  .auth-art {
    border-right: 0;
    border-bottom: 1px solid var(--line);
  }
  .auth-art h1 {
    font-size: clamp(26px, 5vw, 36px);
  }
  input:not([type="checkbox"]):not([type="color"]),
  textarea,
  select,
  .editor-form input,
  .editor-form textarea,
  .editor-form select,
  .copy-input > input,
  .buyer-form input {
    font-size: 16px !important;
  }
  .button,
  .icon-button,
  .segmented button,
  .tabs button,
  .auth-resend button,
  .social-links a {
    min-height: 44px;
  }
  .icon-button,
  .social-links a {
    min-width: 44px;
  }
  .catalog-actions {
    flex-wrap: wrap;
  }
  .form-row,
  .editor-form .form-row,
  .discount-form .form-row {
    grid-template-columns: minmax(0, 1fr);
  }
  .current-plan > div,
  .activation-summary > div {
    min-width: 0;
    flex-basis: 150px;
  }
  .setup-step-footer {
    gap: 12px;
  }
  .setup-header {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    padding-inline: 20px;
  }
  .setup-header > .actions {
    display: contents;
  }
  .setup-header .brand {
    grid-column: 1;
    grid-row: 1;
  }
  .setup-header .actions > .button {
    grid-column: 2;
    grid-row: 1;
  }
  .setup-header .save-status {
    grid-column: 1 / -1;
    grid-row: 2;
  }
  .setup-sidebar {
    top: auto;
  }
  .setup-layout {
    padding-inline: 16px;
  }
  .setup-main {
    padding-inline: 20px;
  }
  .launch-product {
    flex-direction: column;
  }
  .launch-product-image {
    width: 100%;
    min-height: 0;
    aspect-ratio: 16 / 9;
  }
  .modal-backdrop {
    padding-top: max(12px, env(safe-area-inset-top));
    padding-bottom: max(12px, env(safe-area-inset-bottom));
  }
  .modal {
    max-height: calc(900px - 24px);
  }
  .store-container {
    padding-inline: 16px;
  }
  .product-detail-page .public-product-copy,
  .product-sections > section {
    padding: clamp(18px, 5vw, 26px);
  }
}
@media (max-width: 380px) {
  .landing-copy h1 {
    font-size: clamp(36px, 11vw, 42px);
  }
  .landing-copy .actions {
    align-items: stretch;
    flex-direction: column;
  }
  .landing-phone {
    width: min(230px, 85%);
  }
  .landing-art {
    min-height: 480px;
  }
  .floating-label {
    max-width: 100%;
    left: 0;
  }
  .floating-security {
    right: 0;
    max-width: 100%;
  }
  .topbar {
    padding-inline: 12px;
  }
  .topbar-actions {
    gap: 4px;
  }
  .dashboard-content {
    padding-inline: 16px;
  }
  .page-heading {
    align-items: stretch;
    flex-direction: column;
  }
  .page-heading .date-filter {
    margin-top: 0;
  }
  .stat-grid,
  .fees-grid,
  .permission-grid,
  .choice-grid,
  .preview-gallery {
    grid-template-columns: minmax(0, 1fr);
  }
  .style-option {
    grid-template-columns: 72px minmax(0, 1fr);
    padding: 12px;
    column-gap: 12px;
  }
  .style-swatch > b {
    white-space: normal;
  }
  .setup-header .save-status {
    order: 3;
    flex-basis: 100%;
  }
  .setup-step-footer .button {
    flex: 1 1 100%;
  }
  .segmented {
    flex-wrap: wrap;
  }
  .modal > header,
  .editor-form,
  .buyer-form {
    padding: 16px;
  }
  .preview-modal {
    padding: 16px 12px;
  }
}
@media (max-height: 600px) and (min-width: 761px) {
  .auth-page {
    min-height: 900px;
  }
  .auth-art,
  .auth-content {
    padding-block: 24px;
  }
  .auth-art h1 {
    margin-block: 16px;
  }
}

/* The creator workspace shares the landing page's visual system. */
:is(
  .app-shell,
  .guided-setup,
  .auth-page,
  .modal-backdrop,
  .initial-loading,
  .setup-loading
) {
  --font: "Sore Geist", Arial, sans-serif;
  --ink: #f5f5f5;
  --muted: #999;
  --line: #242424;
  --bg: #000;
  --surface: #080808;
  --surface-raised: #141414;
  --purple: #f4a0c6;
  --purple-dark: #ffc4df;
  --brand-gradient: linear-gradient(100deg, #b5096b, #c33748);
  --brand-on-gradient: #fff;
  font-family: var(--font);
  color: var(--ink);
  background: var(--bg);
  line-height: 1.6;
}
:is(.app-shell, .guided-setup, .auth-page, .modal-backdrop)
  :is(h1, h2, h3, h4, .plan-price, .stat-card > strong, .chart-label > strong) {
  font-family: var(--font);
  font-weight: 550;
  letter-spacing: -0.04em;
}
.sore-brand.brand {
  display: inline-flex;
  gap: 0;
  color: #f5f5f5;
  font:
    750 34px/1 "Sore Geist",
    Arial,
    sans-serif;
  letter-spacing: -2px;
}
.sore-brand > span {
  color: #fc6767;
}
:is(.app-shell, .guided-setup, .auth-page, .modal-backdrop) .button {
  min-height: 46px;
  padding: 12px 21px;
  border-radius: 999px;
  font-family: var(--font);
  font-size: 14px;
  font-weight: 550;
  box-shadow: none;
  transition:
    background 0.15s,
    border-color 0.15s,
    filter 0.15s;
  transform: none;
}
:is(.app-shell, .guided-setup, .auth-page, .modal-backdrop) .button.primary {
  background: var(--brand-gradient);
  color: #fff;
  border-color: transparent;
}
:is(.app-shell, .guided-setup, .auth-page, .modal-backdrop)
  .button.primary:hover {
  filter: brightness(1.12);
}
:is(.app-shell, .guided-setup, .auth-page, .modal-backdrop) .button.outline {
  background: transparent;
  border-color: #333;
}
:is(.app-shell, .guided-setup, .auth-page, .modal-backdrop)
  .button.outline:hover {
  background: #121212;
  border-color: #555;
}
:is(.app-shell, .guided-setup, .auth-page, .modal-backdrop) .button.compact {
  min-height: 40px;
  padding: 9px 16px;
  font-size: 13px;
}
:is(.app-shell, .guided-setup, .auth-page, .modal-backdrop) .icon-button {
  min-width: 40px;
  min-height: 40px;
  border-radius: 50%;
}
:is(.app-shell, .guided-setup, .auth-page, .modal-backdrop)
  :is(button, a, input, select, textarea):focus-visible {
  outline: 2px solid #fc8fb8;
  outline-offset: 4px;
}
:is(.app-shell, .guided-setup, .auth-page, .modal-backdrop)
  :is(input:not([type="checkbox"]):not([type="color"]), textarea, select) {
  font-family: var(--font);
  font-size: 15px !important;
  border-color: #303030;
  border-radius: 10px;
  background-color: #090909;
  color: #ededed;
  min-height: 46px;
  padding: 12px 14px;
}
:is(.app-shell, .guided-setup, .auth-page, .modal-backdrop) label {
  font-size: 14px;
  font-weight: 450;
}
:is(.app-shell, .guided-setup, .auth-page, .modal-backdrop) label small {
  font-size: 12px;
  line-height: 1.7;
}
:is(.app-shell, .guided-setup, .auth-page, .modal-backdrop) .badge {
  border-radius: 999px;
  padding: 4px 10px;
  font-size: 11px;
  font-weight: 450;
  line-height: 1.6;
  letter-spacing: 0;
}
:is(.app-shell, .guided-setup, .auth-page, .modal-backdrop) .badge.green {
  background: #12281f;
  color: #a2d9bf;
}
:is(.app-shell, .guided-setup, .auth-page, .modal-backdrop) .badge.purple {
  background: #2b1825;
  color: #e8accc;
}
:is(.app-shell, .guided-setup, .auth-page, .modal-backdrop) .badge.gray {
  background: #191919;
  color: #b9b9b9;
}
:is(.app-shell, .guided-setup, .auth-page, .modal-backdrop) .notice {
  background: transparent;
  border: 0;
  border-left: 2px solid #5b3d4a;
  border-radius: 0;
  padding: 12px 0 12px 18px;
  font-size: 13px;
  line-height: 1.8;
}
:is(.app-shell, .guided-setup, .auth-page, .modal-backdrop) .notice p {
  font-size: 13px;
}
:is(.app-shell, .guided-setup, .auth-page, .modal-backdrop)
  :is(.eyebrow, .micro-label, .greeting) {
  font-weight: 450;
  letter-spacing: 1.2px;
  font-size: 10px;
}

/* Navigation is a quiet rail, with one clear selected destination. */
.app-shell .sidebar {
  width: 236px;
  padding: 31px 20px 0;
  background: #000;
  border-color: #1d1d1d;
}
.app-shell .sidebar > .brand {
  padding-left: 12px;
  font-size: 34px;
}
.app-shell .workspace-switch {
  margin: 32px 0 26px;
  border: 0;
  border-top: 1px solid #242424;
  border-bottom: 1px solid #242424;
  border-radius: 0;
  padding: 19px 9px;
  background: transparent;
}
.app-shell :is(.workspace-switch b, .profile-bottom b) {
  font-size: 13px;
  font-weight: 500;
}
.app-shell :is(.workspace-switch small, .profile-bottom small) {
  font-size: 11px;
}
.app-shell .avatar {
  background: #2b2335;
  color: #d8c8ec;
  border-radius: 50%;
}
.app-shell .nav-label {
  color: #777;
  font-size: 9px;
  font-weight: 450;
}
.app-shell .sidebar nav {
  gap: 4px;
}
.app-shell .sidebar nav > a {
  border-radius: 999px;
  min-height: 44px;
  font-size: 13px;
  font-weight: 400;
  padding: 11px 13px;
  color: #999;
}
.app-shell .sidebar nav > a.active {
  color: #fff;
  background: #171717;
  font-weight: 500;
}
.app-shell .sidebar nav > a.active > svg {
  color: #f2a3c7;
}
.app-shell .sidebar nav > a:hover {
  color: #eee;
  background: #101010;
}
.app-shell .nav-count {
  background: none;
  padding: 0;
  font-size: 11px;
}
.app-shell .settings-label {
  margin-top: 30px;
}
.app-shell .sidebar-store-link {
  display: flex;
  align-items: center;
  gap: 11px;
  min-height: 44px;
  font-size: 12px;
  color: #999;
  margin: 24px 9px 0;
}
.app-shell .sidebar-store-link:hover {
  color: #fff;
}
.app-shell .profile-bottom {
  padding-block: 20px;
  margin-top: 12px;
}
.app-shell .app-main {
  margin-left: 236px;
  width: calc(100% - 236px);
}
.app-shell .topbar {
  padding-inline: clamp(24px, 4vw, 64px);
  height: 78px;
  border-color: #1d1d1d;
}
.app-shell .breadcrumb {
  font-size: 12px;
  gap: 10px;
}
.app-shell .breadcrumb > b {
  font-weight: 450;
  color: #bcbcbc;
}
.app-shell .mode-pill {
  font-size: 10px;
  border: 0;
  border-radius: 0;
  padding: 0;
  background: transparent;
  color: #808080;
}
.app-shell .dashboard-content {
  max-width: 1500px;
  padding: 48px clamp(24px, 4vw, 64px) 64px;
  margin-inline: auto;
}
.app-shell .page-heading {
  align-items: center;
  gap: 24px;
  margin-bottom: 36px;
}
.app-shell .page-heading h1 {
  font-size: clamp(32px, 3vw, 44px);
  line-height: 1.1;
  letter-spacing: -0.055em;
  font-weight: 550;
}
.app-shell .page-heading p {
  margin-top: 12px;
  font-size: 15px;
  color: #999;
}
.app-shell .greeting {
  color: #ad8e9d;
  margin-bottom: 14px;
}
.app-shell
  :is(.panel, .stat-card, .pricing-card, .prompt-card, .fallback-card) {
  background: transparent;
  border: 0;
  border-radius: 0;
  box-shadow: none;
}
.app-shell .panel {
  border-top: 1px solid #242424;
  overflow: visible;
}
.app-shell .panel-heading {
  padding: 24px 0;
}
.app-shell .panel-heading h2 {
  font-size: 19px;
  font-weight: 500;
}
.app-shell .count-pill {
  background: transparent;
  font-size: 12px;
}
.app-shell .table-toolbar {
  padding: 24px 0;
}
.app-shell :is(.table-toolbar h2, .table-toolbar .count-pill) {
  font-weight: 500;
}
.app-shell .table-scroll {
  border-top: 1px solid #242424;
}
.app-shell .table-scroll th {
  background: transparent;
  padding: 15px 18px;
  font-size: 11px;
  font-weight: 400;
  color: #888;
  border-color: #242424;
}
.app-shell .table-scroll td {
  padding: 20px 18px;
  font-size: 13px;
  border-color: #242424;
}
.app-shell .table-scroll td > b {
  font-weight: 500;
}
.app-shell .table-scroll td > small {
  font-size: 11px;
  margin-top: 5px;
}
.app-shell .table-scroll tr:hover td {
  background: #080808;
}
.app-shell .table-note {
  padding-inline: 0;
  font-size: 12px;
}
.app-shell .search-input {
  background: transparent;
  border-color: #333;
  border-radius: 999px;
  padding-inline: 15px;
}
.app-shell .search-input input {
  border: 0;
  background: transparent;
  border-radius: 0;
  padding: 10px 0;
  margin: 0;
  font-size: 13px !important;
  min-height: 40px;
}
.app-shell .search-input:focus-within {
  border-color: #d989ad;
}
.app-shell .search-input input:focus {
  outline: none;
}
.app-shell .tabs {
  gap: 22px;
}
.app-shell .tabs button {
  border-radius: 0;
  padding: 13px 0;
  font-size: 13px;
  color: #999;
  background: none;
}
.app-shell .tabs button.active {
  border-bottom-color: #ed9bbf;
  color: #f5f5f5;
  background: none;
}
.app-shell .tabs button > span {
  background: none;
  color: #777;
  padding: 0;
  margin-left: 7px;
  font-size: 11px;
}
.app-shell .toolbar {
  margin-bottom: 12px;
  gap: 20px;
}
.app-shell .date-filter {
  border-radius: 999px;
  background: none;
  border-color: #333;
  min-height: 44px;
}
.app-shell .date-filter select {
  min-height: 42px;
  background: transparent;
  border: 0;
  padding: 8px 0;
  font-size: 13px !important;
  margin: 0;
}

/* Products sit on open rows; covers provide color without enclosing cards. */
.app-shell .product-card-grid {
  display: block;
}
.app-shell .catalog-card {
  display: grid;
  grid-template-columns: 152px minmax(0, 1fr);
  align-items: center;
  gap: 30px;
  padding: 28px 0;
  background: none;
  border: 0;
  border-bottom: 1px solid #242424;
  border-radius: 0;
  overflow: visible;
}
.app-shell .catalog-cover {
  width: 152px;
  height: 174px;
  aspect-ratio: auto;
  border: 0;
  border-radius: 2px;
  padding: 0;
  background: #111;
}
.app-shell .catalog-cover img {
  height: 100%;
  width: 100%;
  object-fit: cover;
  transition: opacity 0.15s;
}
.app-shell .catalog-cover:hover img {
  transform: none;
  opacity: 0.9;
}
.app-shell .catalog-details {
  padding: 0;
  min-width: 0;
}
.app-shell .catalog-labels {
  display: flex;
  align-items: center;
  gap: 13px;
  flex-wrap: wrap;
}
.app-shell .catalog-labels .micro-label {
  font-size: 9px;
  color: #888;
  margin: 0;
}
.app-shell .catalog-details h3 {
  font-size: 24px;
  line-height: 1.2;
  letter-spacing: -0.8px;
  margin-top: 11px;
}
.app-shell .catalog-price {
  justify-content: flex-start;
  gap: 18px;
  margin: 10px 0 17px;
  padding: 0;
  border: 0;
}
.app-shell .catalog-price strong {
  font-size: 15px;
  font-weight: 500;
}
.app-shell .catalog-price > span {
  font-size: 12px;
}
.app-shell .catalog-actions {
  padding: 0;
  margin: 0;
  border: 0;
  gap: 6px;
  justify-content: flex-start;
  flex-wrap: wrap;
}
.app-shell .catalog-actions > .button {
  margin-right: 5px;
  font-size: 12px;
  min-height: 38px;
}
.app-shell .catalog-actions > .icon-button {
  margin: 0;
  width: 38px;
  min-width: 38px;
  height: 38px;
  min-height: 38px;
}
.app-shell .add-product-card {
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: flex-start;
  gap: 14px;
  width: 100%;
  min-height: 92px;
  padding: 25px 0;
  background: none;
  border: 0;
  border-radius: 0;
  color: #aaa;
}
.app-shell .add-product-card > span {
  width: 35px;
  height: 35px;
  border-radius: 50%;
  background: #191219;
  color: #d68bae;
  margin: 0;
}
.app-shell .add-product-card > b {
  font-size: 14px;
  font-weight: 400;
}
.app-shell .add-product-card > small {
  display: none;
}
.app-shell .info-line {
  border-top: 1px solid #242424;
  padding: 20px 0;
  margin-top: 0;
  font-size: 11px;
  gap: 14px;
}

/* Overview: open metrics, an editorial launch area, and quiet next steps. */
.app-shell .launch-hero {
  background: none;
  border: 0;
  border-radius: 0;
  padding: 26px 0 45px;
  gap: 50px;
  grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr);
  border-bottom: 1px solid #242424;
}
.app-shell .launch-hero .eyebrow {
  color: #a8ccb8;
}
.app-shell .launch-hero h2 {
  font-size: clamp(28px, 3vw, 40px);
  line-height: 1.1;
  max-width: 470px;
  margin-top: 16px;
}
.app-shell .launch-hero p {
  font-size: 15px;
  line-height: 1.8;
  margin: 20px 0 25px;
  max-width: 430px;
}
.app-shell .launch-store-preview {
  min-width: 0;
  padding: 0 15px;
  text-align: center;
}
.app-shell .launch-preview-profile {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 11px;
  text-align: left;
  margin-bottom: 22px;
}
.app-shell .launch-preview-profile > span {
  display: grid;
  place-items: center;
  border-radius: 50%;
  width: 40px;
  height: 40px;
  background: #2c2030;
  color: #e2bdd9;
  font-size: 15px;
}
.app-shell .launch-preview-profile strong {
  font-size: 14px;
  font-weight: 500;
}
.app-shell .launch-preview-profile small {
  display: block;
  color: #888;
  font-size: 10px;
  margin-top: 3px;
}
.app-shell .launch-preview-covers {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 9px;
  margin-bottom: 23px;
}
.app-shell .launch-preview-covers > div {
  width: 82px;
  height: 110px;
  display: grid;
  place-items: center;
  background: #101010;
  transform: rotate(-6deg);
}
.app-shell .launch-preview-covers > div:nth-child(2) {
  transform: translateY(-9px);
}
.app-shell .launch-preview-covers > div:nth-child(3) {
  transform: rotate(6deg);
}
.app-shell .launch-preview-covers img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.app-shell .launch-section-heading {
  margin: 34px 0 15px;
  gap: 18px;
}
.app-shell .launch-section-heading h2 {
  font-size: 21px;
}
.app-shell .launch-products {
  display: block;
}
.app-shell .launch-product {
  display: flex;
  flex-direction: row;
  gap: 23px;
  width: 100%;
  background: none;
  border: 0;
  border-bottom: 1px solid #242424;
  border-radius: 0;
  text-align: left;
  padding: 23px 0;
  box-shadow: none;
}
.app-shell .launch-product:hover {
  background: #070707;
  border-color: #242424;
}
.app-shell .launch-product-image {
  flex: 0 0 90px;
  width: 90px;
  min-height: 0;
  height: 112px;
  aspect-ratio: auto;
  background: #111;
  border-radius: 1px;
}
.app-shell .launch-product > div:last-child {
  padding: 0;
  min-width: 0;
  align-self: center;
}
.app-shell .launch-product h3 {
  font-size: 19px;
  margin-top: 9px;
  line-height: 1.3;
}
.app-shell .launch-product p {
  display: none;
}
.app-shell .launch-product > div > b {
  font-size: 13px;
  margin-top: 9px;
  font-weight: 450;
}
.app-shell .launch-next-grid {
  gap: 40px;
  margin-top: 36px;
}
.app-shell .launch-next-grid > .panel {
  padding: 25px 0 0;
}
.app-shell .launch-next-grid > .panel > svg {
  color: #b4ccbe;
  width: 21px;
}
.app-shell .launch-next-grid > .panel:nth-child(2) > svg {
  color: #c9b7e3;
}
.app-shell .launch-next-grid h3 {
  font-size: 20px;
  margin-top: 15px;
}
.app-shell .launch-next-grid p {
  font-size: 14px;
  line-height: 1.8;
  margin-block: 12px 15px;
}
.app-shell .launch-next-grid .subtle-link {
  font-size: 13px;
  font-weight: 450;
  text-decoration: underline;
  text-underline-offset: 5px;
}
.app-shell .launch-empty {
  background: none;
  border: 0;
  border-radius: 0;
  padding: 40px 0;
  min-height: 0;
}
.app-shell .launch-metrics-note {
  padding: 24px 0;
  font-size: 12px;
}
.app-shell .store-link-strip {
  background: none;
  border: 0;
  border-block: 1px solid #242424;
  border-radius: 0;
  padding: 20px 0;
  margin-bottom: 32px;
}
.app-shell .store-link-strip :is(.link-mark, button) {
  border-radius: 999px;
}
.app-shell .store-link-strip small {
  font-size: 12px;
}
.app-shell .stat-grid {
  gap: 0;
  margin-bottom: 32px;
}
.app-shell .stat-card {
  padding: 0 25px 0 0;
}
.app-shell .stat-card + .stat-card {
  border-left: 1px solid #242424;
  padding-left: 25px;
}
.app-shell .stat-card > div {
  font-size: 12px;
}
.app-shell .stat-card > div > svg {
  display: none;
}
.app-shell .stat-card > strong {
  font-size: clamp(27px, 3vw, 39px);
  margin: 10px 0 7px;
  font-weight: 500;
}
.app-shell .stat-card > small {
  font-size: 11px;
}
.app-shell .overview-grid {
  gap: 36px;
}
.app-shell .chart-label {
  padding: 0;
}
.app-shell .chart-label > strong {
  font-size: 29px;
}
.app-shell .chart-label > span,
.app-shell .chart-label small {
  font-size: 11px;
}
.app-shell .revenue-bars {
  padding-inline: 0;
}
.app-shell .revenue-bars i {
  background: linear-gradient(100deg, #b5096b, #f0788d);
  border-radius: 99px;
}
.app-shell .setup-panel > p {
  padding-inline: 0;
  font-size: 13px;
}
.app-shell .setup-tasks,
.app-shell .setup-footnote {
  margin-inline: 0;
}
.app-shell .setup-tasks > a {
  padding-block: 16px;
  font-size: 13px;
}
.app-shell .recent-table-wrap {
  padding-inline: 0;
}
.app-shell .workspace-ai {
  padding: 28px 0;
  border-top: 1px solid #242424;
}
.app-shell .workspace-ai-logos {
  display: flex;
  align-items: center;
  gap: 18px;
  margin-bottom: 24px;
}
.app-shell .workspace-ai-logos img {
  filter: invert(85%) sepia(19%) saturate(473%) hue-rotate(308deg);
}
.app-shell .workspace-ai-logos img:nth-child(2) {
  filter: invert(86%) sepia(17%) saturate(357%) hue-rotate(98deg);
}
.app-shell .workspace-ai .eyebrow {
  font-size: 9px;
  color: #aa8c9c;
}
.app-shell .workspace-ai h2 {
  font-size: 31px;
  line-height: 1.1;
  margin-top: 14px;
}
.app-shell .workspace-ai p {
  font-size: 14px;
  color: #999;
  margin-block: 17px 22px;
  max-width: 300px;
}
.app-shell .workspace-footnote {
  font-size: 11px;
  margin-top: 30px;
}

/* Forms, integrations, and billing keep meaningful grouping without boxes. */
.app-shell .settings-panel {
  padding: 28px 0;
}
.app-shell .form-section {
  padding: 0 0 26px;
  margin-bottom: 28px;
  border-color: #242424;
}
.app-shell .form-section h3 {
  font-size: 21px;
}
.app-shell .form-section > p {
  font-size: 14px;
  margin-top: 9px;
  margin-bottom: 25px;
}
.app-shell .settings-panel .section-icon {
  padding: 0;
  gap: 17px;
}
.app-shell .section-icon h2 {
  font-size: 23px;
}
.app-shell .section-icon > svg {
  color: #cdb8df;
}
.app-shell .section-icon p {
  font-size: 14px;
}
.app-shell .settings-panel > p {
  font-size: 14px;
  margin-block: 20px;
}
.app-shell .settings-panel > .actions {
  padding: 0;
  margin-block: 24px;
}
.app-shell .fees-grid {
  border: 0;
  background: none;
  border-radius: 0;
  margin-block: 28px;
  gap: 0;
}
.app-shell .fees-grid > div {
  background: none;
  border-right: 1px solid #242424;
  padding: 0 22px;
}
.app-shell .fees-grid > div:first-child {
  padding-left: 0;
}
.app-shell .fees-grid > div:last-child {
  border-right: 0;
}
.app-shell .fees-grid b {
  font-size: 17px;
  font-weight: 450;
}
.app-shell .fees-grid small {
  font-size: 11px;
}
.app-shell .connect-layout {
  grid-template-columns: minmax(0, 1.3fr) minmax(250px, 0.8fr);
  gap: 50px;
}
.app-shell .integration-panel {
  padding: 26px 0 32px;
}
.app-shell .integration-icon {
  background: #241c2d;
  color: #d5c2ed;
  border-radius: 50%;
  width: 48px;
  height: 48px;
}
.app-shell .integration-panel h2 {
  font-size: 28px;
  margin-top: 21px;
}
.app-shell .integration-panel > p {
  font-size: 15px;
  line-height: 1.8;
  margin-block: 16px 24px;
}
.app-shell .permission-grid {
  background: none;
  border: 0;
  border-block: 1px solid #242424;
  border-radius: 0;
  padding: 20px 0;
  gap: 16px;
  margin-bottom: 25px;
}
.app-shell .permission-grid > span {
  font-size: 12px;
}
.app-shell .permission-grid svg {
  color: #9ac5ad;
}
.app-shell .copy-input {
  border-radius: 999px;
  background: #090909;
  border-color: #333;
}
.app-shell .copy-input input {
  border: 0;
  background: transparent;
  border-radius: 999px;
  font-size: 13px !important;
  margin: 0;
}
.app-shell .prompt-card {
  padding: 26px 0;
  border-top: 1px solid #242424;
}
.app-shell .prompt-card h3 {
  font-size: 23px;
  margin-block: 14px 22px;
}
.app-shell .prompt-card > button {
  background: none;
  border: 0;
  border-bottom: 1px solid #242424;
  border-radius: 0;
  padding: 20px 0;
  margin: 0;
  font-size: 14px;
  line-height: 1.8;
}
.app-shell .prompt-card > button > svg {
  color: #ad7e96;
}
.app-shell .fallback-card {
  padding: 28px 0;
}
.app-shell .fallback-card h3 {
  font-size: 21px;
}
.app-shell .fallback-card p {
  font-size: 14px;
}
.app-shell .connection-list {
  padding: 0;
}
.app-shell .connection-list > div {
  padding-block: 20px;
}
.app-shell .connection-list b {
  font-size: 14px;
  font-weight: 450;
}
.app-shell .connection-list small {
  font-size: 12px;
}
.app-shell .current-plan {
  padding: 25px 0;
}
.app-shell .current-plan h2 {
  font-size: 25px;
}
.app-shell .current-plan p {
  font-size: 13px;
}
.app-shell .pricing-grid {
  gap: 50px;
  max-width: none;
}
.app-shell .pricing-card {
  padding: 28px 0;
  border-top: 1px solid #242424;
}
.app-shell .pricing-card h2 {
  font-size: 27px;
  margin-block: 19px;
}
.app-shell .plan-price {
  font-size: 52px;
  letter-spacing: -2px;
  font-weight: 500;
}
.app-shell .plan-price > span {
  font-size: 12px;
}
.app-shell .pricing-card > p,
.app-shell .pricing-card li {
  font-size: 14px;
}
.app-shell .pricing-card li {
  margin-block: 16px;
}
.app-shell .pricing-card > small {
  font-size: 12px;
}

/* Product editing and setup use the same fields, dividers, and pill actions. */
.modal-backdrop {
  background: #000b;
  backdrop-filter: blur(10px);
}
.modal-backdrop .modal {
  background: #080808;
  border: 1px solid #303030;
  border-radius: 22px;
  box-shadow: 0 30px 90px #000a;
}
.modal-backdrop .modal > header {
  padding: 24px 30px;
  border-color: #292929;
}
.modal-backdrop .modal > header h2 {
  font-size: 24px;
  font-weight: 500;
}
.modal-backdrop .editor-form {
  padding: 28px 30px;
}
.modal-backdrop .editor-form label {
  font-size: 14px;
}
.modal-backdrop .delivery-box {
  background: none;
  border: 0;
  border-top: 1px solid #292929;
  border-radius: 0;
  padding: 25px 0 0;
}
.modal-backdrop .delivery-box h3 {
  font-size: 20px;
}
.modal-backdrop .editor-grid {
  gap: 28px;
}
.modal-backdrop .cover-picker {
  background: #101010;
  border-radius: 10px;
  border-color: #383838;
}
.modal-backdrop
  :is(.presentation-section, .presentation-editor, .presentation-block) {
  background: none;
  border-radius: 0;
}
:is(.guided-setup, .modal-backdrop) .segmented button {
  border-radius: 999px;
  font-size: 13px;
  min-height: 42px;
  padding: 10px 16px;
  background: none;
  border-color: #333;
  color: #999;
}
:is(.guided-setup, .modal-backdrop) .segmented button.active {
  background: #241a21;
  color: #f4bed8;
  border-color: #876071;
}
.guided-setup .setup-header {
  background: #000;
  border-color: #242424;
  padding-inline: clamp(20px, 5vw, 72px);
}
.guided-setup .setup-layout {
  max-width: 1320px;
  gap: 65px;
  padding: 50px 40px;
}
.guided-setup .setup-sidebar h1 {
  font-size: 38px;
  line-height: 1.1;
  letter-spacing: -1.8px;
  font-weight: 500;
}
.guided-setup .setup-sidebar > p {
  font-size: 14px;
}
.guided-setup .setup-sidebar > .eyebrow {
  color: #a2c4b3;
}
.guided-setup .setup-sidebar li {
  background: none;
  border-radius: 0;
  padding: 17px 0;
  border-bottom: 1px solid #202020;
}
.guided-setup .setup-sidebar li > span {
  border-radius: 50%;
  background: #141414;
  color: #888;
  border: 1px solid #333;
}
.guided-setup .setup-sidebar li.current > span {
  color: #fff;
  background: var(--brand-gradient);
  border-color: transparent;
}
.guided-setup .setup-sidebar li.current b {
  color: #f4b2d1;
}
.guided-setup .setup-sidebar li.done > span {
  color: #aad4bd;
  background: #18271f;
  border-color: transparent;
}
.guided-setup .setup-no-ai {
  border: 0;
  border-radius: 0;
  background: none;
  padding: 20px 0;
}
.guided-setup .setup-main {
  background: none;
  border: 0;
  border-top: 1px solid #242424;
  border-radius: 0;
  padding: 30px 0 0;
  box-shadow: none;
}
.guided-setup .setup-step-heading h2 {
  font-size: 32px;
  line-height: 1.15;
  letter-spacing: -1.2px;
}
.guided-setup .setup-step-heading p {
  font-size: 15px;
  line-height: 1.8;
}
.guided-setup .setup-deliverable {
  border: 0;
  border-top: 1px solid #242424;
  background: none;
  border-radius: 0;
  padding: 22px 0;
}
.guided-setup .choice-grid > button {
