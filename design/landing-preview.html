.sf-page {
  --sf-gradient: linear-gradient(100deg, #ec008c, #fc6767);
  --sf-button-gradient: linear-gradient(100deg, #b5096b, #c33748);
  --sf-muted: #999;
  --sf-line: #242424;
  background: #000;
  color: #f5f5f5;
  font-family: "Sore Geist", Arial, sans-serif;
  font-size: 16px;
  line-height: 1.6;
}
.sf-page :where(h1, h2, h3, h4, p, figure) {
  margin: 0;
}
.sf-page :where(h1, h2, h3, h4) {
  font-family: inherit;
  font-weight: 600;
  color: inherit;
  letter-spacing: -0.04em;
  line-height: 1.15;
}
.sf-page :where(a, p, h1, h2, h3, code) {
  overflow-wrap: anywhere;
}
.sf-page :where(a, button, summary):focus-visible {
  outline: 2px solid #fc6767;
  outline-offset: 5px;
}
.sf-page ul {
  padding: 0;
  list-style: none;
}
.sf-container {
  max-width: 1200px;
  margin-inline: auto;
  padding-inline: 40px;
}
.sf-skip {
  position: fixed;
  top: -100px;
  left: 16px;
  z-index: 100;
  background: #fff;
  color: #000;
  padding: 12px 20px;
  border-radius: 999px;
}
.sf-skip:focus {
  top: 12px;
}
.sf-header {
  border-bottom: 1px solid #181818;
}
.sf-nav {
  height: 88px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 32px;
}
.sf-wordmark {
  font-size: 34px;
  line-height: 1;
  letter-spacing: -2px;
  font-weight: 750;
  flex-shrink: 0;
}
.sf-wordmark > span {
  color: #fc6767;
}
.sf-nav nav,
.sf-nav > div {
  display: flex;
  align-items: center;
  gap: 26px;
}
.sf-nav nav a,
.sf-login {
  font-size: 14px;
  color: #aaa;
}
.sf-nav nav a:hover,
.sf-login:hover {
  color: #fff;
}
.sf-button {
  font:
    600 15px/1.4 "Sore Geist",
    Arial,
    sans-serif;
  display: inline-flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  min-height: 54px;
  padding: 15px 26px;
  max-width: 100%;
  border: 0;
  border-radius: 999px;
  transition: filter 0.15s;
  background: none;
}
.sf-primary {
  background: var(--sf-button-gradient);
  color: #fff;
}
.sf-primary:hover {
  filter: brightness(1.12);
}
.sf-button:disabled {
  opacity: 1;
  cursor: not-allowed;
  filter: saturate(0.8);
}
.sf-nav .sf-button {
  font-size: 13px;
  min-height: 42px;
  padding: 11px 20px;
}
.sf-text-link {
  display: inline-flex;
  align-items: center;
  min-height: 44px;
  font-size: 14px;
  color: #bbb;
  text-decoration: underline;
  text-underline-offset: 5px;
}
.sf-text-link:hover {
  color: #fff;
}
.sf-hero {
  text-align: center;
  padding-top: 68px;
}
.sf-offer-note {
  font-size: 12px;
  color: #d0d0d0;
  display: inline-flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 7px;
}
.sf-offer-note > span {
  color: #858585;
}
.sf-hero > h1 {

/* One desktop composition, scaled proportionally on every screen. */
.sf-phone-canvas {
  width: 100%;
  max-width: 1000px;
  aspect-ratio: 1000 / 720;
  margin-inline: auto;
  position: relative;
  --sf-phone-scale: 1;
  overflow: clip;
}
.sf-phone-stage {
  position: absolute;
  top: 0;
  left: 0;
  width: 1000px;
  max-width: none;
  height: 720px;
  gap: 42px;
  padding: 76px 24px 40px;
  transform: scale(var(--sf-phone-scale));
  transform-origin: top left;
  overflow: visible;
}
.sf-iphone {
  flex: 0 0 276px;
  height: 568px;
  border-radius: 48px;
}
.sf-phone-coach .sf-phone-screen {
  background: #f8e5d7;
  color: #3f2920;
}
.sf-phone-creator .sf-phone-screen {
  background: #e5def8;
  color: #30263f;
}
.sf-phone-guide .sf-phone-screen {
  background: #dceee5;
  color: #1f3e32;
}
.sf-phone-screen .sf-phone-status {
  color: inherit;
}
.sf-phone-screen
  :is(
    .sf-phone-url,
    .sf-phone-type,
    .sf-phone-profile p,
    .sf-phone-product > p,
    .sf-phone-profile svg,
    .sf-phone-extra,
    .sf-phone-credit
  ) {
  color: #655d62;
}
.sf-phone-screen .sf-phone-credit b {

}
.sf-phone-extra {

/* A real four-sided block: all faces share the same rotating 3D object. */

.sf-ai-cube {
  --cube-height: 60px;
  --cube-depth: 30px;
  width: 200px;
  height: var(--cube-height);
  perspective: 650px;
}
.sf-ai-cube-rotor {
  position: relative;
  width: 100%;
  height: 100%;
  transform-style: preserve-3d;
  transform: translateZ(calc(-1 * var(--cube-depth)));
  animation: sf-cube-roll 16s infinite cubic-bezier(0.65, 0, 0.35, 1);
}
.sf-ai-cube-face {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 20px;
  backface-visibility: hidden;
  transform: rotateX(calc(var(--face) * 90deg)) translateZ(var(--cube-depth));
  border-block: 1px solid #ffffff12;
}
.sf-ai-cube-face strong {
  font-size: 23px;
  letter-spacing: -0.5px;
  font-weight: 550;
}
.sf-ai-cube-face img {
  width: 28px;
  height: 28px;
}
.sf-ai-coral {
  color: #f6d4bc;
  background: #3f2922;
}
.sf-ai-mint {
  color: #c2e7d8;
  background: #1d4034;
}
.sf-ai-lilac {
  color: #e0d3ff;
  background: #38284b;
}
.sf-ai-neutral {
  color: #e5e5e5;
  background: #292929;
}
.sf-ai-coral img {
  filter: invert(87%) sepia(16%) saturate(622%) hue-rotate(328deg);
}
.sf-ai-mint img {
  filter: invert(90%) sepia(18%) saturate(337%) hue-rotate(100deg);
}
.sf-ai-lilac img {
  filter: invert(89%) sepia(20%) saturate(733%) hue-rotate(204deg);
}
.sf-mcp-mark {
  font: 11px/1 monospace;
  letter-spacing: -1px;
}
.sf-works-with:is(:hover, :focus) .sf-ai-cube-rotor {
  animation-play-state: paused;
}
@keyframes sf-cube-roll {
  0%,
  19% {
    transform: translateZ(calc(-1 * var(--cube-depth))) rotateX(0deg);
  }
  25%,
  44% {
    transform: translateZ(calc(-1 * var(--cube-depth))) rotateX(-90deg);
  }
  50%,
  69% {
    transform: translateZ(calc(-1 * var(--cube-depth))) rotateX(-180deg);
  }
  75%,
  94% {
    transform: translateZ(calc(-1 * var(--cube-depth))) rotateX(-270deg);
  }
  100% {
    transform: translateZ(calc(-1 * var(--cube-depth))) rotateX(-360deg);
  }
}
