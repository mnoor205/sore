<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Product views demo</title><style>
:root { color-scheme: dark; --foreground: #f5f5f5; --background: #080808; --border: #303030; --chart-1: #f4a0c6; --secondary: #191919; --muted-foreground: #aaa; --radius: 8px; --font-sans: system-ui, sans-serif; }
body { margin: 0; background: var(--background); }
main { max-width: 850px; margin: auto; padding: clamp(16px, 4vw, 40px); line-height: 1.5; }
main{--line:var(--border);--purple:var(--chart-1);--muted:var(--muted-foreground,#999);color:var(--foreground);font-family:var(--font-sans,system-ui)}header{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted)}select{background:var(--secondary);color:var(--foreground);border:1px solid var(--border);border-radius:var(--radius);padding:6px}h2{margin:14px 0 2px}p{margin:4px 0}h3{margin-bottom:0}.visit-panel{
  margin-bottom: 28px;
  min-width: 0;
}
.visit-panel > p,
.visit-panel small,
.visit-summary span,
.visit-caption,
.visit-scale {
  color: var(--muted);
  font-size: 13px;
}
.visit-summary,
.visit-caption,
.visit-ranking li > div:first-child {
  display: flex;
  gap: 12px;
  justify-content: space-between;
}
.visit-summary {
  justify-content: flex-start;
  gap: clamp(12px, 5vw, 76px);
  padding: 14px 0;
}
.visit-summary strong,
.visit-summary small {
  display: block;
}
.visit-summary strong {
  font-size: clamp(20px, 3vw, 32px);
  line-height: 1.3;
}
.visit-caption {
  flex-wrap: wrap;
}
.visit-chart {
  margin: 12px 0 24px;
}
.visit-plot {
  display: flex;
  gap: 8px;
  height: 136px;
  margin: 8px 5px 4px 0;
}
.visit-scale {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.visit-line {
  position: relative;
  flex: 1;
}
.visit-line svg,
.visit-line input {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}
.visit-line svg * {
  vector-effect: non-scaling-stroke;
  fill: none;
}
.visit-gridlines {
  stroke: var(--line);
}
.visit-line polyline {
  stroke: var(--purple);
  stroke-width: 2;
}
.visit-point {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--purple);
  transform: translate(-50%, -50%);
}
.visit-line input {
  opacity: 0;
  margin: 0;
  cursor: crosshair;
}
.visit-line:focus-within {
  outline: 2px solid var(--purple);
  outline-offset: 4px;
}
.visit-ranking {
  list-style: none;
  padding: 0;
  margin: 0;
}
.visit-ranking li {
  padding: 10px 0;
}
.visit-ranking li > div:first-child {
  font-size: 14px;
  flex-wrap: wrap;
  gap: 2px 12px;
}
.visit-ranking b {
  overflow-wrap: anywhere;
}
.visit-track {
  height: 5px;
  background: var(--line);
  margin: 6px 0 2px;
  border-radius: 5px;
}
.visit-track i {
  display: block;
  height: 100%;
  min-width: 1px;
  background: var(--purple);
  border-radius: inherit;
}
.app-shell .report-range {
  display: inline-flex;
  position: relative;
  flex: none;
  margin: 0;
}
.app-shell .dashboard-content label.report-range select {
  appearance: none;
  width: auto;
  min-height: 44px;
  margin: 0;
  padding: 8px 32px 8px 14px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--surface);
  color: var(--ink);
  font: 500 14px/1.4 var(--font);
  cursor: pointer;
}
.app-shell .report-range svg {
  pointer-events: none;
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
}
.app-shell [data-section="analytics"] .panel {
  padding: 20px 0;
}
.app-shell [data-section="analytics"] .panel-heading {
  padding: 0;
  flex-wrap: wrap;
  gap: 8px;
}
.app-shell [data-section="analytics"] :is(h2, h3) {
  font-size: 18px;
  line-height: 1.35;
  font-weight: 550;
}
.app-shell
  [data-section="analytics"]
  :is(.visit-summary strong, .traffic-metrics dd) {
  font-size: clamp(22px, 3vw, 30px);
  font-weight: 550;
  line-height: 1.3;
  font-variant-numeric: tabular-nums;
}
.app-shell
  [data-section="analytics"]
  :is(
    p,
    dt,
    small,
    .visit-summary span,
    .visit-caption,
    .visit-scale,
    .traffic-axis,
    .traffic-dates,
    table,
    summary,
    .checkbox-label
  ) {
  font-size: 14px;
  line-height: 1.45;
}
